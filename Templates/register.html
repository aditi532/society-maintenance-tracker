{% extends "auth-base.html" %}{% block title %}Create account · Maintain{% endblock %}
{% block form %}<div class="auth-copy compact"><span class="kicker">JOIN YOUR SOCIETY</span><h1>Create your<br>resident account.</h1><p>A few details and you are ready to report and track issues.</p></div>{% if error %}<div class="form-alert">{{ error }}</div>{% endif %}<form method="post" class="clean-form compact-form"><label>Full name<input name="full_name" maxlength="120" placeholder="Your full name" required></label><label>Email address<input type="email" name="email" maxlength="160" placeholder="you@example.com" required></label><div class="field-pair"><label>Phone<input name="phone" maxlength="30" placeholder="Phone number" required></label><label>Apartment / unit<input name="unit_number" maxlength="40" placeholder="e.g. A-104" required></label></div><div class="field-pair"><label>Password<input type="password" name="password" placeholder="Create password" required></label><label>Confirm password<input type="password" name="confirm_password" placeholder="Repeat password" required></label></div><button class="btn primary wide" type="submit">Create account <span>→</span></button></form><div class="auth-links"><span>Already registered? <a href="{{ url_for('login') }}">Sign in</a></span></div>{% endblock %}
